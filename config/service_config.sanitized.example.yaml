config_files:
  prompt_config: prompt_config.example.yaml
  # prompt_config: prompt_config_zh.example.yaml

agent:
  service_name: street-inspection-agent

logging:
  enabled: true
  level: INFO
  json: true
  include_request_id: true
  include_event_id: true
  log_model_payload_summary: true
  log_callback_payload_summary: true

event_store:
  backend: file
  base_dir: ./data/event_store

orchestrator:
  enable_async_refine: false
  chain_mode: vlm1_only

callback:
  plugin: http_callback
  endpoint: https://backend.example/api/v1/events/callback
  auth_token:
  auth_token_env:
  timeout_ms: 120000
  retry:
    max_attempts: 3
    backoff_ms: 1000
  send_preliminary: true
  send_refined: false

mock_clients:
  preliminary_fixture: ../fixtures/mock_vlm_preliminary/road_occupying_vendor.json
  segmentation_fixture: ../fixtures/mock_sam3/road_occupying_vendor.json
  evidence_judge_fixture: ../fixtures/mock_vlm_judge/road_occupying_vendor.json

model_clients:
  mode: http
  preliminary:
    base_url: http://your-vlm-host:8010
    endpoint: /v1/chat/completions
    model_name: your-vlm-model
    timeout_ms: 12000
    temperature: 0.2
    max_tokens: 8192
  judge:
    base_url: http://your-vlm-host:8010
    endpoint: /v1/chat/completions
    model_name: your-vlm-model
    timeout_ms: 15000
    temperature: 0.0
    max_tokens: 8192
  sam3:
    base_url: http://your-sam3-host:8001
    endpoint: /segment
    timeout_ms: 10000

minio:
  enabled: true
  endpoint: your-minio-host:9000
  access_key: your-access-key
  secret_key: your-secret-key
  secure: false
  presign_expiry_seconds: 3600

review:
  enable_manual_review: false
