scene_policies:
  南山路:
    front:
      enabled_categories:
        - road_occupying_vendor
        - goods_blocking_road
        - unauthorized_electrical_wiring
        - motor_vehicle_illegal_parking
        - nonmotor_vehicle_illegal_parking
        - vagrants_blocking_roadway
        - begging_blocking_roadway
        - off_leash_dog_nuisance
      location_constraints:
        - focus on roadside space, sidewalk occupation, storefront frontage, and pedestrian passage
    left:
      enabled_categories:
        - unauthorized_electrical_wiring
      location_constraints:
        - focus on storefront frontage, sidewalk blockage, and near-entrance obstruction
    right:
      enabled_categories:
        - unauthorized_electrical_wiring
      location_constraints:
        - focus on storefront frontage, sidewalk blockage, and near-entrance obstruction

  水坊街:
    front: {}
    left:
      enabled_categories:
        - staff_not_wear_mask
      location_constraints:
        - focus on storefront frontage, sidewalk blockage, and outdoor charging behavior
    right:
      enabled_categories:
        - staff_not_wear_mask
      location_constraints:
        - focus on storefront frontage, sidewalk blockage, and outdoor charging behavior

prompts:
  preliminary:
    role_block: |
      You are a city-street visual inspection model for a robot-dog patrol backend.
      Your task is to analyze one inspection image from a robot-dog patrol and determine whether any violation event or risk event is present.
    scene_activation_block_template: |
      Current detection scope:
      - enabled_categories: {enabled_categories}
      - location_constraints: {location_constraints}
      - open_risk_guidance: {open_risk_guidance}

      Use rules:
      - only classify within enabled_categories unless the evidence strongly supports open_risk
      - use location_constraints when judging spatial relations, occupation, blockage, parking position, storefront boundaries, and charging behavior
    category_focus_block_template: |
      Allowed category references:
      {category_definitions}
    reasoning_block: |
      Always analyze the whole scene before deciding the category.
      Do not classify from a single object alone. Use object-to-object and object-to-environment spatial relations.
      If multiple distinct violations are visible, output multiple candidates rather than merging them into one.
      segmentation_targets are for downstream SAM3 and must focus on the key objects, boundaries, and relation-critical regions for each candidate.
      If the image is blurry, occluded, distant, cropped, or incomplete, mention that in the analysis and lower confidence.
      If no visible violation or risk exists, output exactly one candidate with violation_category="none".
    output_contract_block: |
      You must output JSON only, in this exact order:
      1. environment_analysis
      2. scene_elements
      3. candidates

      Each candidate must include:
      - evidence_reasoning
      - relation_hint
      - segmentation_targets
      - violation_category
      - open_risk_type
      - confidence

      Rules:
      - violation_category: one of the standard categories, open_risk, or none
      - open_risk_type: non-empty only when violation_category=open_risk
      - confidence: float in [0, 1]
      - keep different violations as separate candidates
      - do not duplicate the same visual evidence under multiple categories
      - if violation_category=none, output exactly one candidate with empty segmentation_targets and empty relation_hint
    user: |
      Analyze this inspection image under the configured scene policy and output the required JSON.
  judge:
    system: |
      You are the second-stage evidence judgment model in a city-street visual inspection pipeline.
      Your role is not to freely reclassify the whole image. Your role is to judge whether the current candidate category is supported by the SAM3 segmentation result image and the provided segmentation semantics.
    user: |
      category_code={category_code}
      mask_labels={mask_labels}
      relation_hint={relation_hint}
      evidence_basis_summary={evidence_basis_summary}

category_registry:
  road_occupying_vendor:
    definition: A vendor or storefront extends stalls, racks, goods, or temporary setup beyond the storefront boundary and occupies sidewalk or roadway space.
    common_objects:
      - vendor stall
      - canopy
      - display rack
      - stacked goods
      - storefront boundary
      - sidewalk
      - roadway edge
    relation_focus:
      - goods or display setup extends beyond storefront boundary
      - stall or goods occupies pedestrian or vehicle passage space
    exceptions:
      - landscape installation
      - limited normal display next to a kiosk

  goods_blocking_road:
    definition: Goods, materials, signboards, or miscellaneous items are placed on the sidewalk and block normal pedestrian passage.
    common_objects:
      - stacked goods
      - materials
      - signboard
      - miscellaneous items
      - storefront entrance
      - sidewalk
    relation_focus:
      - objects are placed on the sidewalk
      - objects block the pedestrian path
    exceptions: []

  unauthorized_electrical_wiring:
    definition: A power cable is extended from an indoor or storefront power source to the outdoor area for charging a vehicle or device.
    common_objects:
      - electric cable
      - charger
      - electric scooter
      - outdoor charging point
      - storefront power source
    relation_focus:
      - cable connects indoor power source to outdoor vehicle
      - visible outdoor charging behavior through extended wiring
    exceptions: []

  motor_vehicle_illegal_parking:
    definition: A motor vehicle is parked on a sidewalk, tactile paving, bus stop area, or another place where parking is not allowed.
    common_objects:
      - car
      - motorcycle
      - sidewalk
      - tactile paving
      - bus stop area
      - parking line
      - non parking area
    relation_focus:
      - motor vehicle occupies a prohibited parking area
    exceptions: []

  nonmotor_vehicle_illegal_parking:
    definition: An unattended non-motor vehicle is parked on a sidewalk, tactile paving, or pedestrian passage and affects normal movement.
    common_objects:
      - electric bicycle
      - bicycle
      - tricycle
      - sidewalk
      - passage edge
      - tactile paving
      - unattended vehicle
    relation_focus:
      - non-motor vehicle is parked inside a pedestrian passage area
      - vehicle is unattended or not in active use
    exceptions: []

  vagrants_blocking_roadway:
    definition: A disheveled person sits or lies in a roadside or passage area for a prolonged time and affects movement order.
    common_objects:
      - person
      - roadside
      - passage area
      - ground bedding
    relation_focus:
      - person is sitting or lying in a roadside or passage area
      - the position clearly interferes with nearby movement
    exceptions: []

  begging_blocking_roadway:
    definition: A person with visible begging-related items stays in a roadside or passage area and occupies movement space.
    common_objects:
      - person
      - bowl
      - sign board
      - roadside
      - passage area
    relation_focus:
      - person carries visible begging-related items
      - person remains in a position that occupies pedestrian passage
    exceptions: []

  off_leash_dog_nuisance:
    definition: A pedestrian is with a dog in public space and the dog is not visibly controlled by a leash.
    common_objects:
      - pedestrian
      - pet dog
      - leash
    relation_focus:
      - dog moves near a person without visible leash control
      - dog appears to be off leash in public space
    exceptions: []

  staff_not_wear_mask:
    definition: A food service worker is operating, serving, or handling food without wearing a mask.
    common_objects:
      - food service storefront
      - staff member
      - mask
      - counter
      - food preparation area
    relation_focus:
      - staff member is inside a food service operating area
      - staff member is working without a visible mask
    exceptions: []

open_risk_registry:
  guidance: |
    If obvious risk evidence exists but does not fit the allowed standard categories,
    output violation_category="open_risk" and provide a concise open_risk_type.
  examples:
    - fire or smoke
    - fallen tree or branch
    - flooding or standing water
    - damaged manhole or broken road surface
    - exposed infrastructure
    - collapsed barrier or fence
    - traffic accident scene
    - construction hazard
    - large debris on the road
    - sanitation emergency
