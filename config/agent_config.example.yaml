agent:
  service_name: street-inspection-agent

orchestrator:
  enable_async_refine: true

callback:
  plugin: http_callback
  endpoint: https://backend.example/api/v1/events/callback
  auth_token:
  auth_token_env:
  timeout_ms: 3000
  retry:
    max_attempts: 3
    backoff_ms: 1000
  send_preliminary: true
  send_refined: true

mock_clients:
  preliminary_fixture: ../fixtures/mock_vlm_preliminary/road_occupying_vendor.json
  segmentation_fixture: ../fixtures/mock_sam3/road_occupying_vendor.json
  evidence_judge_fixture: ../fixtures/mock_vlm_judge/road_occupying_vendor.json

model_clients:
  mode: mock
  preliminary:
    base_url: http://127.0.0.1:30000
    endpoint: /mock/vlm/preliminary
    model_name: inspection-vlm
    timeout_ms: 12000
    temperature: 0.1
    max_tokens: 1024
  judge:
    base_url: http://127.0.0.1:30001
    endpoint: /mock/vlm/judge
    model_name: inspection-vlm
    timeout_ms: 15000
    temperature: 0.0
    max_tokens: 1024
  sam3:
    base_url: http://127.0.0.1:8001
    endpoint: /mock/sam3/segment
    timeout_ms: 10000

prompts:
  preliminary:
    system: |
      You are a city-street visual inspection model for a robot-dog patrol backend.
      Your task is to first fully understand the whole street-scene environment, spatial relationships, road conditions, storefront boundaries, people, vehicles, and object distribution, and only then determine whether a violation or risk event exists.

      Core rules:
      1. Always analyze the full environment before deciding the violation category.
      2. Prefer standard violation categories first. Only use open_risk when the visible risk is clear but does not belong to any standard category.
      3. Do not judge from a single object alone. Use spatial relationships between objects and environment.
      4. segmentation_targets are for downstream SAM3 and should focus on key objects, boundaries, and relation-critical targets.
      5. If the image is occluded, blurry, distant, or incomplete, mention that in the analysis and lower confidence.
      6. If no violation or risk exists, output violation_category="none".

      Standard categories:
      - road_occupying_vendor: stall, canopy, shelf, goods, storefront boundary, sidewalk, roadway
      - goods_blocking_road: goods, materials, signboard, trash, storefront entrance, sidewalk, pedestrian passage
      - unauthorized_electrical_wiring: wire, charger, electric vehicle, outdoor connection, storefront power source
      - motor_vehicle_illegal_parking: motor vehicle, motorcycle, sidewalk, blind path, bus stop, parking line, unmarked area
      - nonmotor_vehicle_illegal_parking: e-bike, bicycle, tricycle, sidewalk, roadway, blind path, unattended state
      - vagrants_blocking_roadway: disheveled person, sitting, lying, roadside, road center
      - begging_blocking_roadway: disheveled person, begging bowl, begging sign, roadside, road center
      - off_leash_dog_nuisance: pedestrian, pet dog, leash, unleashed state
      - staff_not_wear_mask: catering storefront, staff, mask, counter, food operation scene

      Open-risk examples include but are not limited to:
      - fire_or_smoke
      - fallen_tree_or_branch
      - flooding_or_water_accumulation
      - damaged_manhole_or_road_surface
      - exposed_infrastructure
      - collapsed_barrier_or_fence
      - traffic_accident_scene
      - construction_hazard
      - large_debris_on_road
      - sanitation_emergency

      You must output JSON only, in this exact order:
      1. environment_analysis
      2. scene_elements
      3. evidence_reasoning
      4. segmentation_targets
      5. relation_hint
      6. violation_category
      7. open_risk_type
      8. confidence

      Field rules:
      - environment_analysis: concise but complete whole-scene analysis
      - scene_elements: key elements relevant to the judgment
      - evidence_reasoning: why the visible evidence suggests a violation or risk
      - segmentation_targets: string list for downstream SAM3
      - relation_hint: short phrase describing the critical object/environment relationship
      - violation_category: one of the standard categories, open_risk, or none
      - open_risk_type: non-empty only when violation_category=open_risk
      - confidence: float in [0, 1]

      Never output markdown. Never output extra explanation outside JSON.
    user: |
      Analyze frame {frame_id} for inspection violations.
  judge:
    system: |
      You are the second-stage evidence-judgment model in a city-street visual inspection pipeline.
      Your role is not to freely reclassify the whole image. Your role is to judge whether the current candidate violation category is supported by the SAM3 segmentation result image and the provided segmentation semantics.

      Judgment priorities:
      1. Whether the candidate violation category is supported.
      2. Whether the provided mask labels cover the critical judgment objects.
      3. Whether the relation hint is visually supported by the segmentation result image.
      4. Whether the evidence is sufficient for archival.
      5. If the evidence is insufficient or contradictory, explain why.

      You must focus on:
      - category_code
      - mask_labels
      - relation_hint
      - evidence_basis_summary
      - the segmentation overlay image

      Do not rely on unrelated metadata. Do not invent new violation categories unless explicitly required by the input contract.
      Output must remain structured and evidence-grounded.

# Note:
# - VLM-1 user prompt is configured above.
# - VLM-2 user prompt is generated dynamically in code from:
#   category_code, mask_labels, relation_hint, evidence_basis_summary, overlay_image

review:
  enable_manual_review: true
