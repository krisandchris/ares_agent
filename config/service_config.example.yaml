config_files:
  prompt_config: prompt_config.example.yaml

agent:
  service_name: street-inspection-agent

orchestrator:
  enable_async_refine: false
  chain_mode: vlm1_only

callback:
  plugin: http_callback
  endpoint: https://backend.example/api/v1/events/callback
  auth_token:
  auth_token_env:
  timeout_ms: 120000
  retry:
    max_attempts: 3
    backoff_ms: 1000
  send_preliminary: true
  send_refined: false

mock_clients:
  preliminary_fixture: ../fixtures/mock_vlm_preliminary/road_occupying_vendor.json
  segmentation_fixture: ../fixtures/mock_sam3/road_occupying_vendor.json
  evidence_judge_fixture: ../fixtures/mock_vlm_judge/road_occupying_vendor.json

model_clients:
  mode: http
  preliminary:
    base_url: http://127.0.0.1:30000
    endpoint: /v1/chat/completions
    model_name: inspection-vlm
    timeout_ms: 12000
    temperature: 0.2
    max_tokens: 4096
  judge:
    base_url: http://127.0.0.1:30001
    endpoint: /v1/chat/completions
    model_name: inspection-vlm
    timeout_ms: 15000
    temperature: 0.0
    max_tokens: 4096
  sam3:
    base_url: http://127.0.0.1:8001
    endpoint: /segment
    timeout_ms: 10000

minio:
  enabled: true
  endpoint: 127.0.0.1:9000
  access_key: minioadmin
  secret_key: minioadmin
  secure: false
  presign_expiry_seconds: 3600

review:
  enable_manual_review: false
