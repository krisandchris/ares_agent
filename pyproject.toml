[project]
name = "ares-agent"
version = "0.2.0"
description = "Urban street visual inspection backend agent built around Agno."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agno",
    "fastapi>=0.115.0",
    "gradio>=6.9.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.1",
    "pyyaml>=6.0.2",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ares_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
